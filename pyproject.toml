[project]
name = "codeinsight"
version = "0.1.0a0"
description = "Architecture-aware, multi-agent code review with a FastAPI web experience."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "altair>=5.5,<6",
    "boto3>=1.43,<2",
    "clickhouse-driver>=0.2.11,<0.3",
    "fastapi>=0.139.2,<1",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pandas>=2.3,<3",
    "psycopg2-binary>=2.9.12,<3",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "redis>=8.0.1,<9",
    "tiktoken>=0.13,<1",
    "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
observability = ["langfuse>=4.14.1,<5"]
legacy = [
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5.1,<2",
    "langchain-litellm>=0.7,<1",
    "langgraph>=1.2.9,<2",
    "litellm>=1.91.4,<1.92",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# This legacy LangGraph module is scheduled for deletion when native
# choreography lands. New code remains fully linted in every milestone.
"workflow/swarm_analysis/agent_execution/nodes.py" = [
    "E402",
    "E501",
    "F401",
    "F541",
    "F841",
    "I001",
    "UP006",
    "UP035",
    "UP041",
    "UP045",
]
