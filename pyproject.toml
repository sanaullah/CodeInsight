[project]
name = "codeinsight"
version = "0.1.0a0"
description = "Architecture-aware, multi-agent code review with a FastAPI web experience."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "altair>=5.5,<6",
    "boto3>=1.43,<2",
    "clickhouse-driver>=0.2.11,<0.3",
    "fastapi>=0.139.2,<1",
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5.1,<2",
    "langchain-litellm>=0.7,<1",
    "langfuse>=4.14.1,<5",
    "langgraph>=1.2.9,<2",
    # 1.92+ publishes Linux-only platform wheels and requires a local Rust/MSVC
    # toolchain on Windows. Keep the newest universal-wheel release line.
    "litellm>=1.91.4,<1.92",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pandas>=2.3,<3",
    "psycopg2-binary>=2.9.12,<3",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "redis>=8.0.1,<9",
    "streamlit>=1.60,<2",
    "tiktoken>=0.13,<1",
    "uvicorn[standard]>=0.51,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
