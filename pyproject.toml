[project]
name = "codeinsight"
version = "0.1.0a0"
description = "Architecture-aware, multi-agent code review with a FastAPI web experience."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.139.2,<1",
    "instructor>=1.15.1,<2",
    "pydantic>=2.13.4,<3",
    "pydantic-ai-slim[openai]>=1.65,<2",
    "python-dotenv>=1.2.2,<2",
    "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
observability = ["langfuse>=4.14.1,<5"]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_provider: opt-in bounded test against configured provider credentials",
    "live_langfuse: opt-in metadata-only test against self-hosted Langfuse",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
